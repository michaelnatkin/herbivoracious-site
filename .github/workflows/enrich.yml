name: Daily recipe enrichment

on:
  schedule:
    - cron: '0 14 * * *'   # 6am Pacific (7am during DST... close enough)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: enrich
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply next batch
        run: python3 enrichment/apply.py

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.155.3'
          extended: true

      - name: Build check (nothing is pushed if this fails)
        working-directory: ./site
        run: hugo --minify --destination /tmp/enrich-check

      - name: Commit and push
        id: push
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "nothing to publish"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site/content enrichment/state.json
          git commit -m "Daily recipe enrichment: At a glance + FAQs ($(date -u +%F))"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger deploy (pushes made with GITHUB_TOKEN don't trigger it)
        if: steps.push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
